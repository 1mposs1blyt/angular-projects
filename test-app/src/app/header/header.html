<header class="w-full flex flex-row justify-between bg-emerald-500 px-4">
  <h1 class="flex gap-4 items-center">{{siteTitle}}</h1>
  <div class="flex gap-4 items-center">
    @if (isAuthorized) {
      <span>Welcome!</span>
      <button class="flex justify-between items-center bg-purple-500 text-white px-6 py-8" (click)="toggleAuth()">Logout</button>
    }
    @else {
      <span>Please login!</span>
      <button class="flex justify-between items-center bg-purple-500 text-white px-6 py-8" (click)="toggleAuth()">Login</button>
    }
  </div>
</header>
