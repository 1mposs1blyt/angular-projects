<div class="flex flex-col">
  <h3 class="text-2xl text-red-500">{{title}}</h3>
  <p class="text-xl text-amber-500">{{desc}}</p>
  <p class="text-xl text-amber-400">{{likesCount}}</p>
  <button class="bg-red-900 flex w-fit text-white p-2" (click)="onDeleteClick()" >delete</button>
  <button class="bg-amber-900 flex w-fit text-white p-2" (click)="incrementLikes()">like</button>
</div>
